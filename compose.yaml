
services:
  postgres:
    image: postgres:18-alpine
    container_name: contacthub-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:?Database name required}
      POSTGRES_USER: ${DB_USER:?Database user required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: contacthub-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      PORT: 5000

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""

    container_name: contacthub-frontend
    restart: unless-stopped

    ports:
      - "8081:80"

    depends_on:
      - backend

volumes:
  postgres_data:
